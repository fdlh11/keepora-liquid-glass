name: Keepora
description: "Aplikasi pencatatan riwayat perbaikan dan perawatan barang pribadi."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  image_picker: ^1.2.4
  intl: ^0.20.3
  google_fonts: ^6.2.1
  firebase_storage: ^12.4.10
  http: ^1.2.2
  shared_preferences: ^2.5.6
  pdf: ^3.11.1
  printing: ^5.13.3
  lottie: ^3.8.2
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/image/
    - assets/animations/